<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <title>Instagram Post</title>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="logo">
        <img src="images/user-avatar.png" alt="user-avatar" class="avatar">
    </header>

    <main>
        <section class="post-head">
            <img src="images/avatar-vangogh.jpg" alt="avatar of the post user" class="post-user-img">
            <div>
                <p class="bold">Vincent van Gogh</p>
                <p >Zudert, Netherelands</p>
            </div>
        </section>

        <section class="post">
            <img src="images/post-vangogh.jpg" alt="art portrait of Vincent van Gogh" class="post-img">
        </section>

        <section class="bottom">
                <div class="post-options">
                    <img src="images/icon-heart.png" alt="like/unlike the post">
                    <img src="images/icon-comment.png" alt="comment on post">
                    <img src="images/icon-dm.png" alt="send direct messae to someone">
                </div>
                <p class="bold">21,492 Likes</p>
                <p><span class="bold">vincey1853</span> just took a few mushrooms lol.</p>
        </section>
    </main>








    <script src="index.js"></script>
</body>
</html>
